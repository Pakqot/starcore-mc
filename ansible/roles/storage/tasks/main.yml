---
- name: Check current logical volumes
  ansible.builtin.command: lvs --noheadings -o lv_name {{ lvm_vg }}
  register: lv_list
  changed_when: false

- name: Disable active swap
  ansible.builtin.command: swapoff -a
  when: lvm_swap_lv in lv_list.stdout
  changed_when: true

- name: Remove swap logical volume
  community.general.lvol:
    vg: "{{ lvm_vg }}"
    lv: "{{ lvm_swap_lv }}"
    state: absent
    force: true
  when: lvm_swap_lv in lv_list.stdout

- name: Remove swap entry from fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: 'swap'
    state: absent

- name: Extend var logical volume with freed space
  community.general.lvol:
    vg: "{{ lvm_vg }}"
    lv: "{{ lvm_var_lv }}"
    size: "+{{ var_lv_extend_gb }}G"
  register: var_extend
  failed_when: false

- name: Grow var filesystem to match logical volume
  ansible.builtin.command: "resize2fs /dev/{{ lvm_vg }}/{{ lvm_var_lv }}"
  when: var_extend is changed

- name: Install zram-tools
  ansible.builtin.apt:
    name: zram-tools
    state: present

- name: Configure zram swap percentage
  ansible.builtin.lineinfile:
    path: /etc/default/zramswap
    regexp: '^PERCENT='
    line: "PERCENT={{ zram_percent }}"
  notify: restart zramswap

- name: Create svc-data directories for Docker/k3s
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0711"
    owner: root
    group: root
  loop:
    - "{{ svc_data_root }}"
    - "{{ docker_data_root }}"
    - "{{ k3s_data_dir }}"